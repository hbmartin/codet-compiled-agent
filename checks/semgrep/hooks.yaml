rules:
  - id: codet-hook-stop-monotonic
    languages: [cpp]
    severity: ERROR
    message: Accumulate earlier hook stops; a later veto cannot clear continue=false.
    paths:
      include: ["**/hooks.cpp"]
    patterns:
      - pattern: out.stopped = $VALUE;
      - pattern-not: out.stopped = true;
      - pattern-not: out.stopped = out.stopped || $STOP;
