rules:
  - id: codet-backfill-inline-json
    languages: [cpp]
    severity: ERROR
    message: Decode legacy JSON in a per-row exception boundary before persisting references.
    paths:
      include: ["**/state.cpp"]
    pattern: remember_references($SESSION, <... Json::parse(...) ...>)
  - id: codet-provider-cache-owning-commit
    languages: [cpp]
    severity: ERROR
    message: Publish provider snapshots only under an owning transaction guard after commit; nested writes invalidate the snapshot.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              void StateStore::save_provider_state(...) { ... }
          - pattern-inside: |
              void StateStore::append_messages(...) { ... }
          - pattern-inside: |
              void StateStore::replace_history(...) { ... }
      - pattern-either:
          - pattern: $IMPL->cache_provider(...);
          - pattern: $IMPL->publish_provider(...);
      - pattern-not-inside: |
          if ($TX.owner) { ... }
      - pattern-not-inside: |
          if ($ENABLED && $TX.owner) { ... }
      - pattern-not-inside: |
          if ($TX.owner && $ENABLED) { ... }
  - id: codet-provider-cache-publication-noexcept
    languages: [cpp]
    severity: ERROR
    message: Optional cache publication must catch all failures and invalidate cache trust without throwing after commit.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern: |
          void publish_provider(...) { ... }
      - pattern-not: |
          void publish_provider(...) noexcept {
            try { ... } catch (...) { clear_provider_cache(); }
          }
  - id: codet-repair-portable-content-only
    languages: [cpp]
    severity: ERROR
    message: Delegate portable result metadata normalization; do not rewrite arbitrary result_path keys during repair.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-inside: |
          Json StateStore::repair(...) { ... }
      - pattern: $OBJECT["result_path"] = $REFERENCE
  - id: codet-provider-cache-token-boundary
    languages: [cpp]
    severity: ERROR
    message: Acquire optional load-cache tokens inside the guarded population operation, not as throwing publication arguments.
    paths:
      include: ["**/state.cpp"]
    pattern: $IMPL->publish_provider(..., $IMPL->provider_token(...), ...)
