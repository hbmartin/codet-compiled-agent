rules:
  - id: codet-backfill-inline-json
    languages: [cpp]
    severity: ERROR
    message: Decode legacy JSON in a per-row exception boundary before persisting references.
    paths:
      include: ["**/state.cpp"]
    pattern: remember_references($SESSION, <... Json::parse(...) ...>)
  - id: codet-provider-cache-owning-commit
    languages: [cpp]
    severity: ERROR
    message: Publish provider snapshots only under an owning transaction guard after commit; nested writes invalidate the snapshot.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              void StateStore::save_provider_state(...) { ... }
          - pattern-inside: |
              void StateStore::append_messages(...) { ... }
          - pattern-inside: |
              void StateStore::replace_history(...) { ... }
      - pattern-either:
          - pattern: $IMPL->cache_provider(...);
          - pattern: $IMPL->publish_provider(...);
      - pattern-not-inside: |
          if ($TX.owner) { ... }
      - pattern-not-inside: |
          if ($ENABLED && $TX.owner) { ... }
      - pattern-not-inside: |
          if ($TX.owner && $ENABLED) { ... }
  - id: codet-provider-cache-publication-noexcept
    languages: [cpp]
    severity: ERROR
    message: Optional cache publication must catch all failures and invalidate cache trust without throwing after commit.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern: |
          void publish_provider(...) { ... }
      - pattern-not: |
          void publish_provider(...) noexcept {
            try { ... } catch (...) { clear_provider_cache(); }
          }
  - id: codet-repair-portable-content-only
    languages: [cpp]
    severity: ERROR
    message: Delegate portable result metadata normalization; do not rewrite arbitrary result_path keys during repair.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-inside: |
          Json StateStore::repair(...) { ... }
      - pattern: $OBJECT["result_path"] = $REFERENCE
  - id: codet-provider-cache-token-boundary
    languages: [cpp]
    severity: ERROR
    message: Acquire optional load-cache tokens inside the guarded population operation, not as throwing publication arguments.
    paths:
      include: ["**/state.cpp"]
    pattern: $IMPL->publish_provider(..., $IMPL->provider_token(...), ...)
  - id: codet-load-cache-population-boundary
    languages: [cpp]
    severity: ERROR
    message: Load entrypoints must use guarded optional population; direct token acquisition or publication can fail an otherwise valid load.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              Session StateStore::read_session(...) { ... }
          - pattern-inside: |
              Session StateStore::load(...) { ... }
          - pattern-inside: |
              Session StateStore::load_id(...) { ... }
          - pattern-inside: |
              Session StateStore::last(...) { ... }
      - pattern-either:
          - pattern: $IMPL->provider_token(...)
          - pattern: $IMPL->publish_provider(...)

  - id: codet-reconcile-stable-checkpoint-view
    languages: [cpp]
    severity: ERROR
    message: Reconciliation compares persisted messages using snapshot provenance, without resolving checkpoint files again.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-inside: |
          void StateStore::reconcile(...) { ... }
      - pattern-either:
          - pattern: $IMPL->portable(...)
          - pattern: normalize_checkpoint_reference(...)
  - id: codet-state-filesystem-dependency
    languages: [cpp]
    severity: ERROR
    message: Use StateStore's configured filesystem for forks, receipts, and repair backups.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              Session StateStore::fork(...) { ... }
          - pattern-inside: |
              std::string StateStore::preserve_response(...) { ... }
          - pattern-inside: |
              Json StateStore::repair(...) { ... }
      - pattern: NativeFileSystem $FILES;
  - id: codet-transcript-preparation-is-pure
    languages: [cpp]
    severity: ERROR
    message: Preparation must return independent provenance; publish snapshot changes only after successful SQL publication.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-inside: |
          PreparedTranscript prepare(...) { ... }
      - pattern-either:
          - pattern: $S.checkpoint_projection = ...
          - pattern: $S.checkpoint_projection->$FIELD = ...
  - id: codet-prepared-transcript-publication
    languages: [cpp]
    severity: ERROR
    message: Reconciliation and tool completion must apply prepared rows rather than recursively invoking preparing public write methods.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              void StateStore::reconcile(...) { ... }
          - pattern-inside: |
              void StateStore::complete_tool(...) { ... }
      - pattern-either:
          - pattern: save(...)
          - pattern: replace_history(...)
          - pattern: append_messages(...)
          - pattern: tool_finished(...)
          - pattern: remember_references(...)
  - id: codet-transcript-write-ownership
    languages: [cpp]
    severity: ERROR
    message: Public transcript mutation implementations must reject unowned transactions before preparation or publication.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern: |
              void StateStore::append_transcript(...) { ... }
          - pattern: |
              void StateStore::revise_transcript(...) { ... }
          - pattern: |
              void StateStore::replace_transcript(...) { ... }
          - pattern: |
              void StateStore::complete_tool(...) { ... }
      - pattern-not: |
          void StateStore::$METHOD(...) {
            impl_->require_owned_write();
            ...
          }
  - id: codet-transcript-no-session-copy
    languages: [cpp]
    severity: ERROR
    message: Borrow provider state and prepare transcript deltas; do not copy the complete Session in reconciliation or const adapters.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              void StateStore::reconcile(Session &$SOURCE, ...) { ... }
          - pattern-inside: |
              void StateStore::append_messages(const Session &$SOURCE, ...) { ... }
          - pattern-inside: |
              void StateStore::revise_messages(const Session &$SOURCE, ...) { ... }
          - pattern-inside: |
              void StateStore::replace_history(const Session &$SOURCE, ...) { ... }
          - pattern-inside: |
              void StateStore::save(const Session &$SOURCE, ...) { ... }
      - pattern: $TYPE $COPY = $SOURCE;
  - id: codet-recovery-prepared-result
    languages: [cpp]
    severity: ERROR
    message: Reconstructed journal outcomes must use the prepared canonical transcript payload.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-inside: |
          void StateStore::reconcile(...) { ... }
      - pattern: safe_json(Json($RESULT)).dump()
