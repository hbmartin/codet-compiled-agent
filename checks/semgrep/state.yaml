rules:
  - id: codet-backfill-inline-json
    languages: [cpp]
    severity: ERROR
    message: Decode legacy JSON in a per-row exception boundary before persisting references.
    paths:
      include: ["**/state.cpp"]
    pattern: remember_references($SESSION, <... Json::parse(...) ...>)
  - id: codet-provider-cache-owning-commit
    languages: [cpp]
    severity: ERROR
    message: Publish provider snapshots only under an owning transaction guard after commit; nested writes invalidate the snapshot.
    paths:
      include: ["**/state.cpp"]
    patterns:
      - pattern-either:
          - pattern-inside: |
              void StateStore::save_provider_state(...) { ... }
          - pattern-inside: |
              void StateStore::append_messages(...) { ... }
          - pattern-inside: |
              void StateStore::replace_history(...) { ... }
      - pattern-either:
          - pattern: $IMPL->cache_provider(...);
          - pattern: $IMPL->publish_provider(...);
      - pattern-not-inside: |
          if ($TX.owner) { ... }
      - pattern-not-inside: |
          if ($ENABLED && $TX.owner) { ... }
      - pattern-not-inside: |
          if ($TX.owner && $ENABLED) { ... }
